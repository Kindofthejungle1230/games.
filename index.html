<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes - Google Classroom</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #202124;
      color: #e8eaed;
      overflow-x: hidden;
    }

    /* --- STAGE 1: FAKE GOOGLE CLASSROOM COVER --- */
    #coverScreen {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background-color: #202124;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
    }

    .gc-header {
      height: 64px;
      border-bottom: 1px solid #3c4043;
      display: flex;
      align-items: center;
      padding: 0 24px;
      justify-content: space-between;
      background-color: #202124;
    }

    .gc-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.25rem;
      color: #e8eaed;
      font-weight: 500;
    }

    .gc-icon {
      width: 24px;
      height: 24px;
      background-color: #34a853;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: #fff;
    }

    .gc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .gc-card {
      background-color: #2d2e31;
      border-radius: 8px;
      border: 1px solid #3c4043;
      overflow: hidden;
      height: 200px;
      display: flex;
      flex-direction: column;
    }

    .gc-card-banner {
      height: 90px;
      padding: 16px;
      color: white;
      font-weight: 600;
    }

    .b-blue { background-color: #1a73e8; }
    .b-green { background-color: #137333; }
    .b-purple { background-color: #a142f4; }

    .gc-card-title { font-size: 1.1rem; }
    .gc-card-sub { font-size: 0.8rem; opacity: 0.8; margin-top: 4px; }

    /* --- STAGE 2: FAKE 404 / BLOCKED SCREEN --- */
    #blockedScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background-color: #000000;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 200;
      color: #ffffff;
      font-family: monospace;
      padding: 20px;
      text-align: center;
    }

    .error-code {
      font-size: 0.75rem;
      color: #666666;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .blocked-title {
      font-size: 2.5rem;
      font-weight: 900;
      color: #ff3333;
      letter-spacing: 4px;
    }

    /* --- STAGE 3: CASSIAN MAIN SITE --- */
    #cassianSite {
      display: none;
      padding: 20px;
      min-height: 100vh;
      background-color: #0b0f19;
      color: #e2e8f0;
    }

    header {
      text-align: center;
      max-width: 800px;
      margin: 20px auto 30px auto;
    }

    h1.brand-title {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 25px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
    }

    .search-bar {
      width: 100%;
      max-width: 450px;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid #1e293b;
      background-color: #161e2e;
      color: #f8fafc;
      font-size: 1rem;
      outline: none;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .filter-btn {
      background-color: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .filter-btn.active {
      background-color: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      max-width: 1300px;
      margin: 30px auto 0 auto;
    }

    .card {
      background-color: #161e2e;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card h2 {
      font-size: 1.25rem;
      color: #f1f5f9;
    }

    .category-badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      padding: 4px 8px;
      background-color: #0f172a;
      color: #38bdf8;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }

    iframe {
      width: 100%;
      height: 380px;
      border: none;
      border-radius: 10px;
      background-color: #000000;
    }
  </style>
</head>
<body>

  <div id="coverScreen">
    <div class="gc-header">
      <div class="gc-brand">
        <div class="gc-icon">≡</div>
        <span>Google Classroom</span>
      </div>
    </div>
    <div class="gc-grid">
      <div class="gc-card">
        <div class="gc-card-banner b-blue">
          <div class="gc-card-title">General Science</div>
          <div class="gc-card-sub">Period 3</div>
        </div>
      </div>
      <div class="gc-card">
        <div class="gc-card-banner b-green">
          <div class="gc-card-title">World History</div>
          <div class="gc-card-sub">Period 5</div>
        </div>
      </div>
      <div class="gc-card">
        <div class="gc-card-banner b-purple">
          <div class="gc-card-title">English Language Arts</div>
          <div class="gc-card-sub">Period 2</div>
        </div>
      </div>
    </div>
  </div>

  <div id="blockedScreen">
    <div class="error-code">404 file not found</div>
    <div class="blocked-title">BLOCKED</div>
  </div>

  <div id="cassianSite">
    <header>
      <h1 class="brand-title">CASSIAN</h1>
      <p class="subtitle">Your personal unblocked arcade hub.</p>
      
      <div class="controls">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search games...">
        
        <div class="filter-group">
          <button class="filter-btn active" onclick="filterCategory('all', this)">All Games</button>
          <button class="filter-btn" onclick="filterCategory('puzzle', this)">Puzzle</button>
          <button class="filter-btn" onclick="filterCategory('arcade', this)">Arcade</button>
          <button class="filter-btn" onclick="filterCategory('action', this)">Action</button>
        </div>
      </div>
    </header>

    <main class="grid" id="gamesGrid">
      <div class="card" data-category="puzzle" data-title="2048">
        <div class="card-header">
          <h2>2048</h2>
          <span class="category-badge">Puzzle</span>
        </div>
        <iframe src="https://play2048.co/"></iframe>
      </div>

      <div class="card" data-category="arcade" data-title="hextris">
        <div class="card-header">
          <h2>Hextris</h2>
          <span class="category-badge">Arcade</span>
        </div>
        <iframe src="https://hextris.io/"></iframe>
      </div>

      <div class="card" data-category="action" data-title="canvas rider">
        <div class="card-header">
          <h2>Canvas Rider</h2>
          <span class="category-badge">Action</span>
        </div>
        <iframe src="https://playcanv.as/p/2OwybvWm/"></iframe>
      </div>
    </main>
  </div>

  <script>
    let stage = 1; 
    let escCount = 0;

    // Secret Key Sequence Event Listener
    document.addEventListener('keydown', function(e) {
      
      // STAGE 1: Pressing 0-9 hides Classroom and shows small 404 / BLOCKED
      if (stage === 1) {
        if (e.key >= '0' && e.key <= '9') {
          stage = 2;
          document.getElementById('coverScreen').style.display = 'none';
          document.getElementById('blockedScreen').style.display = 'flex';
        }
      } 
      
      // STAGE 2: Pressing Esc 5 times unlocks Cassian
      else if (stage === 2) {
        if (e.key === 'Escape') {
          escCount++;
          if (escCount >= 5) {
            stage = 3;
            document.getElementById('blockedScreen').style.display = 'none';
            document.getElementById('cassianSite').style.display = 'block';
          }
        }
      }
    });

    // Cassian Filter Logic
    let currentCategory = 'all';

    function filterCategory(category, buttonElement) {
      currentCategory = category;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      buttonElement.classList.add('active');
      applyFilters();
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);

    function applyFilters() {
      const searchValue = document.getElementById('searchInput').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.card');

      cards.forEach(card => {
        const category = card.getAttribute('data-category');
        const title = card.getAttribute('data-title').toLowerCase();
        const matchesCategory = (currentCategory === 'all' || category === currentCategory);
        const matchesSearch = title.includes(searchValue);

        card.style.display = (matchesCategory && matchesSearch) ? 'flex' : 'none';
      });
    }
  </script>

</body>
</html>
