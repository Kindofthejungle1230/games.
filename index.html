<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Home - Classroom</title>
  <!-- Pixel Font Import -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d0714;
      --card-bg: #180d28;
      --neon-pink: #ff2a85;
      --neon-purple: #9d4edd;
      --text-main: #ffffff;
      --text-muted: #ff85a1;
      --border-color: #ff2a85;
      
      /* Configurable Minecraft Text Color */
      --minecraft-text-color: #22c55e;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    body {
      background: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      font-family: 'VT323', monospace;
      touch-action: manipulation;
      transition: background 0.2s ease;
    }

    /* Background Animation Canvas - Explicitly non-interactive */
    #particleCanvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none !important;
    }

    /* --- Overlays & Stealth Mask Screens --- */
    .overlay-screen {
      position: fixed; 
      inset: 0; 
      z-index: 9999;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      background: #ffffff; 
      color: #3c4043; 
      text-align: center; 
      font-family: sans-serif;
    }
    .blocked-screen { 
      background: #1a1a1a; 
      color: #ef4444; 
      display: none; 
    }

    /* Invisible Mobile Developer Mode Corner Touch Target (Strict 40x40px) */
    .dev-touch-zone {
      position: absolute; 
      top: 0; 
      right: 0; 
      width: 40px; 
      height: 40px; 
      z-index: 10000;
      background: transparent; 
      -webkit-tap-highlight-color: transparent; 
      cursor: pointer;
      touch-action: manipulation;
    }

    /* --- Core Dashboard Architecture --- */
    .app-container {
      display: none;
      height: 100vh;
      width: 100vw;
      position: relative;
      z-index: 10;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 1rem 1rem 1rem;
    }

    /* --- Header & Date Banner --- */
    .header-section {
      text-align: center;
      margin-top: 0.5rem;
      pointer-events: auto;
    }

    .pixel-day {
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--neon-pink);
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .pixel-date {
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(0.8rem, 2vw, 1.3rem);
      color: #ffffff;
      margin-top: 0.5rem;
      letter-spacing: 3px;
    }

    /* --- Search Bar --- */
    .search-container {
      width: 100%;
      max-width: 720px;
      position: relative;
      margin: 1rem 0;
      z-index: 20;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem 3rem 0.75rem 1.25rem;
      font-family: 'VT323', monospace;
      font-size: 1.6rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease;
      touch-action: auto;
    }

    .search-input::placeholder { 
      color: var(--neon-pink); 
      opacity: 0.7; 
    }

    .search-icon {
      position: absolute; 
      right: 1rem; 
      top: 50%; 
      transform: translateY(-50%);
      color: var(--neon-pink); 
      font-size: 1.4rem; 
      pointer-events: none;
    }

    /* --- Placeholder Games Grid Layout --- */
    .main-content {
      width: 100%;
      max-width: 860px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      width: 100%;
      margin-bottom: 1rem;
    }

    .game-card {
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 10px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      will-change: transform, box-shadow;
    }

    .game-card:hover { 
      transform: translateY(-4px); 
    }

    /* Highlight class triggered on click/tap */
    .game-card.selected {
      border-color: #ffffff !important;
      box-shadow: 0 0 15px var(--border-color);
      transform: scale(1.02);
    }

    .game-card-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      pointer-events: none;
    }

    .game-title-overlay {
      position: absolute;
      bottom: 0; 
      inset-x: 0;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.6rem;
      padding: 0.5rem 0.2rem;
      text-align: center;
      border-top: 2px solid var(--border-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    /* Custom Color styling for Minecraft card */
    .minecraft-card .game-title-overlay {
      color: var(--minecraft-text-color);
    }

    .footer-quote {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      text-align: center;
      pointer-events: none;
    }

    /* --- Bottom Navigation Dock & Settings Controls --- */
    .dock-nav {
      width: 100%;
      max-width: 860px;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0.5rem;
      z-index: 20;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .dock-btn {
      background: transparent;
      border: 2px solid transparent;
      color: var(--text-main);
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      touch-action: manipulation;
    }

    .dock-btn:hover {
      border-color: var(--border-color);
      color: var(--neon-pink);
    }

    .dock-btn.active {
      background: var(--border-color);
      color: #000;
      font-weight: bold;
    }

    .color-picker-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 1.1rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .color-picker-group input[type="color"] {
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      background: none;
      touch-action: manipulation;
    }

    /* Toast Notification */
    #toast-container { 
      position: fixed; 
      bottom: 5rem; 
      right: 1.5rem; 
      z-index: 30000; 
      display: flex; 
      flex-direction: column; 
      gap: 0.5rem; 
      pointer-events: none; 
    }
    .toast { 
      background: var(--card-bg); 
      border: 2px solid var(--border-color); 
      color: #fff; 
      padding: 0.6rem 1rem; 
      border-radius: 6px; 
      font-family: 'VT323', monospace; 
      font-size: 1.3rem; 
    }

    @media (max-width: 768px) {
      .games-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
      .pixel-day { font-size: 1.8rem; }
      .pixel-date { font-size: 0.8rem; }
      .dock-nav { justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- Non-blocking Floating Particle Background -->
  <canvas id="particleCanvas"></canvas>

  <!-- Google Classroom Stealth Mask Cover Screen -->
  <div id="coverScreen" class="overlay-screen">
    <!-- Strict 40x40 Touch Zone for Developer Mode -->
    <div id="devTouchZone" class="dev-touch-zone" title="Dev Mode Target"></div>
    <h2 style="font-size: 2rem; color: #3c4043;">Google Classroom</h2>
    <p style="margin-top: 8px; color: #70757a;">Loading classes...</p>
  </div>

  <!-- Blocked Overlay -->
  <div id="blockedScreen" class="overlay-screen blocked-screen">
    <h1 style="font-size: 2.5rem;">403 Restricted</h1>
    <p style="margin-top: 0.5rem;">Access denied by network administrator.</p>
  </div>

  <!-- Main Dashboard (Games Page) -->
  <div id="mainApp" class="app-container">
    
    <header class="header-section">
      <h1 id="dayDisplay" class="pixel-day">SATURDAY</h1>
      <div id="dateDisplay" class="pixel-date">AUGUST 29, 2026</div>
    </header>

    <main class="main-content">
      <!-- Search Bar -->
      <div class="search-container">
        <input type="text" id="gameSearch" class="search-input" placeholder="Search for G4mes! - v4.01">
        <span class="search-icon">🔍</span>
      </div>

      <!-- Interactive Placeholder Games Grid -->
      <div class="games-grid" id="gamesGrid">
        <!-- Main Minecraft Placeholder Card -->
        <div class="game-card minecraft-card" data-name="minecraft" data-toast="Minecraft — Coming Soon">
          <div class="game-card-icon">🟩</div>
          <div class="game-title-overlay">Minecraft</div>
        </div>
        
        <!-- Auxiliary Placeholder Cards -->
        <div class="game-card" data-name="placeholder 1" data-toast="Placeholder 1 — Coming Soon">
          <div class="game-card-icon">🟦</div>
          <div class="game-title-overlay">Slot 2</div>
        </div>
        <div class="game-card" data-name="placeholder 2" data-toast="Placeholder 2 — Coming Soon">
          <div class="game-card-icon">🟥</div>
          <div class="game-title-overlay">Slot 3</div>
        </div>
        <div class="game-card" data-name="placeholder 3" data-toast="Placeholder 3 — Coming Soon">
          <div class="game-card-icon">🟨</div>
          <div class="game-title-overlay">Slot 4</div>
        </div>
      </div>

      <div class="footer-quote">rub your Chromebook for good luck -</div>
    </main>

    <!-- Bottom Navigation Dock & Themes Menu -->
    <nav class="dock-nav">
      <button class="dock-btn active" id="btnHome">🏠 Home</button>
      <button class="dock-btn" id="btnGames">🎮 Games</button>
      
      <!-- Theme Customizer Pickers -->
      <div class="color-picker-group">
        <label for="textColorPicker">Text:</label>
        <input type="color" id="textColorPicker" value="#ff2a85">
      </div>

      <div class="color-picker-group">
        <label for="mcColorPicker">MC Color:</label>
        <input type="color" id="mcColorPicker" value="#22c55e">
      </div>

      <div class="color-picker-group">
        <label for="bgColorPicker">BG:</label>
        <input type="color" id="bgColorPicker" value="#0d0714">
      </div>

      <button class="dock-btn" id="btnSettings">⚙️ Settings</button>
    </nav>
  </div>

  <div id="toast-container"></div>

  <script>
    /* ==========================================================================
       1. DATE & TIME DISPLAY
       ========================================================================== */
    function updateDateDisplay() {
      const now = new Date();
      const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
      const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
      
      document.getElementById('dayDisplay').textContent = days[now.getDay()];
      document.getElementById('dateDisplay').textContent = `${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
    }
    updateDateDisplay();

    /* ==========================================================================
       2. HIGH-PERFORMANCE PARTICLE ANIMATION ENGINE
       ========================================================================== */
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    
    // Cache particle color to avoid expensive DOM queries during render loop
    let cachedParticleColor = '#ff2a85';

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas, { passive: true });
    resizeCanvas();

    // Generate 35 optimized particle vectors
    for (let i = 0; i < 35; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 1,
        alpha: Math.random() * 0.5 + 0.2,
        speedY: -Math.random() * 0.3 - 0.1
      });
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = cachedParticleColor;
      
      const width = canvas.width;
      const height = canvas.height;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        
        p.y += p.speedY;
        if (p.y < 0) {
          p.y = height;
          p.x = Math.random() * width;
        }
      }
      requestAnimationFrame(renderParticles);
    }
    requestAnimationFrame(renderParticles);

    /* ==========================================================================
       3. INTERACTIVE POINTER EVENTS & UI HANDLERS
       ========================================================================== */
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    // Attach Pointer Events to All Game Placeholder Cards for Touch & Click Reliability
    const gameCards = document.querySelectorAll('.game-card');
    gameCards.forEach(card => {
      const handleSelect = (e) => {
        e.preventDefault();
        gameCards.forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        const toastMsg = card.getAttribute('data-toast') || 'Coming Soon';
        showToast(toastMsg);
      };

      card.addEventListener('pointerdown', handleSelect);
    });

    // Real-time Search Box Filter
    const searchInput = document.getElementById('gameSearch');
    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();
      gameCards.forEach(card => {
        const text = card.getAttribute('data-name') + " " + card.textContent;
        card.style.display = text.toLowerCase().includes(query) ? 'flex' : 'none';
      });
    });

    // Color Pickers Input Events
    const textColorPicker = document.getElementById('textColorPicker');
    const mcColorPicker = document.getElementById('mcColorPicker');
    const bgColorPicker = document.getElementById('bgColorPicker');

    textColorPicker.addEventListener('input', (e) => {
      const val = e.target.value;
      document.documentElement.style.setProperty('--neon-pink', val);
      document.documentElement.style.setProperty('--border-color', val);
      cachedParticleColor = val; // Update particle cache directly
    });

    mcColorPicker.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--minecraft-text-color', e.target.value);
    });

    bgColorPicker.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--bg-color', e.target.value);
    });

    // Dock Navigation Buttons
    document.getElementById('btnHome').addEventListener('pointerdown', () => showToast('Home View Active'));
    document.getElementById('btnGames').addEventListener('pointerdown', () => showToast('Games Dashboard'));
    document.getElementById('btnSettings').addEventListener('pointerdown', () => showToast('Settings Menu'));

    /* ==========================================================================
       4. DEVELOPER MODE ACTIVATION TRIGGERS
       ========================================================================== */
    function activateDeveloperMode() {
      document.getElementById('coverScreen').style.display = 'none';
      document.getElementById('blockedScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'flex';
      showToast('Developer Mode — Games Active');
    }

    // Trigger 1: Mobile 40x40px Invisible Touch Corner Target
    const devTouchZone = document.getElementById('devTouchZone');
    if (devTouchZone) {
      const triggerDevMode = (e) => {
        e.preventDefault();
        e.stopPropagation();
        activateDeveloperMode();
      };
      devTouchZone.addEventListener('pointerdown', triggerDevMode);
    }

    // Trigger 2: Key Binding (Shift + D) & Trigger 3: Escape Chain (5x)
    let escCount = 0;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        escCount++;
        if (escCount >= 5) activateDeveloperMode();
      }
      if (e.shiftKey && e.key.toUpperCase() === 'D') {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        e.preventDefault();
        activateDeveloperMode();
      }
    });
  </script>
</body>
</html>
