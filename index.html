<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Classroom</title>
  <!-- Pixel Font Import -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #120a1c;
      --card-bg: #1c102b;
      --text-color: #ff3b8d;
      --border-color: #ff3b8d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      overflow: hidden;
      font-family: 'VT323', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      transition: background 0.2s;
    }

    /* --- Header & Date (No Text Glow) --- */
    .header-section {
      text-align: center;
      margin-top: 0.5rem;
    }

    .pixel-day {
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--text-color);
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .pixel-date {
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(0.8rem, 2vw, 1.3rem);
      color: #ffffff;
      margin-top: 0.5rem;
      letter-spacing: 3px;
    }

    /* --- Search Box --- */
    .search-container {
      width: 100%;
      max-width: 720px;
      position: relative;
      margin: 1rem 0;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem 3rem 0.75rem 1.25rem;
      font-family: 'VT323', monospace;
      font-size: 1.6rem;
      color: var(--text-color);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input::placeholder { color: var(--text-color); opacity: 0.7; }

    .search-icon {
      position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
      color: var(--text-color); font-size: 1.4rem; pointer-events: none;
    }

    /* --- Games Layout --- */
    .main-content {
      width: 100%;
      max-width: 860px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      width: 100%;
      margin-bottom: 1rem;
    }

    .game-card {
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 10px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, border-color 0.2s;
    }

    .game-card:hover { transform: translateY(-4px); }

    .game-card-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .game-title-overlay {
      position: absolute;
      bottom: 0; inset-x: 0;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.6rem;
      padding: 0.5rem 0.2rem;
      text-align: center;
      border-top: 2px solid var(--border-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer-quote {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.65rem;
      color: var(--text-color);
      margin-bottom: 0.75rem;
      text-align: center;
    }

    /* --- Bottom Dock Navigation & Controls --- */
    .dock-nav {
      width: 100%;
      max-width: 860px;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0.5rem;
      z-index: 100;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .dock-btn {
      background: transparent;
      border: 2px solid transparent;
      color: #ffffff;
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .dock-btn:hover {
      border-color: var(--border-color);
      color: var(--text-color);
    }

    .dock-btn.active {
      background: var(--border-color);
      color: #000;
      font-weight: bold;
    }

    .color-picker-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.2rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .color-picker-group input[type="color"] {
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    @media (max-width: 768px) {
      .games-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
      .pixel-day { font-size: 1.8rem; }
      .pixel-date { font-size: 0.8rem; }
      .dock-nav { justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header-section">
    <h1 id="dayDisplay" class="pixel-day">SATURDAY</h1>
    <div id="dateDisplay" class="pixel-date">AUGUST 29, 2026</div>
  </header>

  <main class="main-content">
    <!-- Search Bar -->
    <div class="search-container">
      <input type="text" id="gameSearch" class="search-input" placeholder="Search for G4mes! - v4.01" oninput="filterGames()">
      <span class="search-icon">🔍</span>
    </div>

    <!-- Games Grid Placeholder (Ready for your games) -->
    <div class="games-grid" id="gamesGrid">
      <div class="game-card" data-name="game1" onclick="alert('Add your game URL here!')">
        <div class="game-card-icon">🎮</div>
        <div class="game-title-overlay">Game 1</div>
      </div>
      <div class="game-card" data-name="game2" onclick="alert('Add your game URL here!')">
        <div class="game-card-icon">🎯</div>
        <div class="game-title-overlay">Game 2</div>
      </div>
      <div class="game-card" data-name="game3" onclick="alert('Add your game URL here!')">
        <div class="game-card-icon">🚀</div>
        <div class="game-title-overlay">Game 3</div>
      </div>
      <div class="game-card" data-name="game4" onclick="alert('Add your game URL here!')">
        <div class="game-card-icon">👾</div>
        <div class="game-title-overlay">Game 4</div>
      </div>
    </div>

    <div class="footer-quote">rub your Chromebook for good luck -</div>
  </main>

  <!-- Bottom Navigation Dock with Live Color Customizers -->
  <nav class="dock-nav">
    <button class="dock-btn active">🏠 Home</button>
    <button class="dock-btn">🎮 Games</button>
    
    <!-- Color Pickers for Customization -->
    <div class="color-picker-group">
      <label for="textColorPicker">Text:</label>
      <input type="color" id="textColorPicker" value="#ff3b8d" oninput="updateTextTheme(this.value)">
    </div>

    <div class="color-picker-group">
      <label for="bgColorPicker">BG:</label>
      <input type="color" id="bgColorPicker" value="#120a1c" oninput="updateBgTheme(this.value)">
    </div>

    <button class="dock-btn">⚙️ Settings</button>
  </nav>

  <script>
    // Live Date Calculation
    function updateDateDisplay() {
      const now = new Date();
      const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
      const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
      
      document.getElementById('dayDisplay').textContent = days[now.getDay()];
      document.getElementById('dateDisplay').textContent = `${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
    }
    updateDateDisplay();

    // Theme Customizer Functions
    function updateTextTheme(color) {
      document.documentElement.style.setProperty('--text-color', color);
      document.documentElement.style.setProperty('--border-color', color);
    }

    function updateBgTheme(color) {
      document.documentElement.style.setProperty('--bg-color', color);
    }

    // Search Box Filtering
    function filterGames() {
      const query = document.getElementById('gameSearch').value.toLowerCase();
      document.querySelectorAll('.game-card').forEach(card => {
        const text = card.getAttribute('data-name') + card.textContent;
        card.style.display = text.toLowerCase().includes(query) ? 'flex' : 'none';
      });
    }
  </script>
</body>
</html>
