<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Google Classroom</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); height: 100vh; overflow: hidden; touch-action: manipulation; }

    /* --- Overlays --- */
    .overlay-screen {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #ffffff; color: #3c4043; text-align: center;
    }
    .blocked-screen { background: #1a1a1a; color: #ef4444; display: none; }

    .dev-touch-zone {
      position: absolute; top: 0; right: 0; width: 48px; height: 48px; z-index: 10000;
      background: transparent; -webkit-tap-highlight-color: transparent;
    }

    /* --- App Layout --- */
    .app-container { display: none; height: 100vh; flex-direction: row; }
    
    sidebar {
      width: 240px; background: #020617; border-right: 1px solid #1e293b;
      display: flex; flex-direction: column; padding: 1rem; gap: 0.5rem; flex-shrink: 0;
    }
    
    .nav-item {
      padding: 0.75rem 1rem; border-radius: 8px; color: var(--text-muted);
      cursor: pointer; transition: all 0.2s; user-select: none;
    }
    .nav-item:hover { background: #1e293b; color: var(--text-main); }
    .nav-item.active { background: var(--accent); color: #020617; font-weight: 600; }

    main { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; }
    .view-page { display: none; height: 100%; }
    .view-page.active { display: flex; flex-direction: column; }

    /* --- Games Layout --- */
    .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
    .game-card {
      background: var(--card-bg); border: 1px solid #334155; padding: 1rem; border-radius: 8px;
      text-align: center; cursor: pointer; transition: transform 0.1s, border-color 0.2s;
    }
    .game-card:active { transform: scale(0.96); }
    .game-card.selected { border-color: var(--accent); background: #0f172a; }

    .game-viewport {
      flex: 1; background: #000; border-radius: 12px; border: 1px solid #334155;
      display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden;
    }
    canvas { background: #000; max-width: 100%; max-height: 100%; touch-action: none; }
    
    .mobile-controls {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; width: 100%; max-width: 200px; margin-top: 0.5rem;
    }
    .ctrl-btn {
      background: #334155; color: #fff; border: none; padding: 0.75rem; border-radius: 6px; font-weight: bold; font-size: 1.2rem;
    }

    @media (max-width: 640px) {
      .app-container { flex-direction: column; }
      sidebar { width: 100%; height: auto; flex-direction: row; justify-content: space-around; border-right: none; border-bottom: 1px solid #1e293b; padding: 0.5rem; }
      main { padding: 0.75rem; }
    }

    /* --- Toast System --- */
    #toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 1000; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { background: var(--card-bg); border: 1px solid var(--accent); padding: 0.75rem 1rem; border-radius: 6px; }
  </style>
</head>
<body>

  <div id="coverScreen" class="overlay-screen">
    <div id="devTouchZone" class="dev-touch-zone"></div>
    <h2>Google Classroom</h2>
    <p style="margin-top: 8px; color: #70757a;">Loading classes...</p>
  </div>

  <div id="blockedScreen" class="overlay-screen blocked-screen">
    <h1>403 Restricted</h1>
    <p>Access denied by network administrator.</p>
  </div>

  <div id="mainApp" class="app-container">
    <sidebar>
      <h2 style="color: var(--accent);">Cassian</h2>
      <div id="nav-dashboard" class="nav-item" onclick="switchTab('view-dashboard', 'nav-dashboard')">Dashboard</div>
      <div id="nav-games" class="nav-item active" onclick="switchTab('view-games', 'nav-games')">Games</div>
      <div id="nav-settings" class="nav-item" onclick="switchTab('view-settings', 'nav-settings')">Settings</div>
    </sidebar>

    <main>
      <section id="view-dashboard" class="view-page">
        <h1>Dashboard</h1>
        <p style="margin-top: 1rem; color: var(--text-muted);">Welcome to the Cassian system control panel.</p>
      </section>

      <!-- Games View -->
      <section id="view-games" class="view-page active">
        <div class="games-grid">
          <div class="game-card selected" onclick="loadGame('snake', this)">🐍 Snake</div>
          <div class="game-card" onclick="loadGame('pong', this)">🏓 Pong</div>
          <div class="game-card" onclick="loadGame('breakout', this)">🧱 Breakout</div>
        </div>

        <div class="game-viewport">
          <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <!-- Touch Controls for Mobile Snake -->
        <div id="snakeControls" class="mobile-controls" style="margin: 0.5rem auto 0 auto;">
          <div></div><button class="ctrl-btn" onclick="changeDir('UP')">▲</button><div></div>
          <button class="ctrl-btn" onclick="changeDir('LEFT')">◀</button>
          <button class="ctrl-btn" onclick="changeDir('DOWN')">▼</button>
          <button class="ctrl-btn" onclick="changeDir('RIGHT')">▶</button>
        </div>
      </section>

      <section id="view-settings" class="view-page">
        <h1>System Settings</h1>
        <button onclick="CassianCDN.testAllMirrors().then(console.log)" style="margin-top: 1rem; padding: 0.5rem 1rem;">Test CDN Mirrors</button>
      </section>
    </main>
  </div>

  <div id="toast-container"></div>

  <script>
    /* --- CDN Fallback --- */
    window.CassianCDN = {
      mirrors: [
        { name: 'jsDelivr', buildUrl: (pkg, file) => `https://cdn.jsdelivr.net/npm/${pkg}/${file}` },
        { name: 'unpkg', buildUrl: (pkg, file) => `https://unpkg.com/${pkg}/${file}` },
        { name: 'cdnjs', buildUrl: (pkg, file) => `https://cdnjs.cloudflare.com/ajax/libs/${pkg}/${file}` }
      ],
      async testAllMirrors(packageSpec = 'jquery@3.6.0', filePath = 'package.json') {
        return await Promise.allSettled(this.mirrors.map(async m => {
          const start = performance.now();
          const res = await fetch(m.buildUrl(packageSpec, filePath), { method: 'HEAD' });
          return { mirror: m.name, latency: Math.round(performance.now() - start), ok: res.ok };
        }));
      }
    };

    /* --- Navigation & Toasts --- */
    function switchTab(viewId, navId) {
      document.querySelectorAll('.view-page').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const targetView = document.getElementById(viewId);
      const targetNav = document.getElementById(navId);
      if (targetView) targetView.classList.add('active');
      if (targetNav) targetNav.classList.add('active');
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    /* --- Mini-Games Engine --- */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let currentGameLoop = null;
    let currentGame = 'snake';

    function loadGame(gameName, cardEl) {
      document.querySelectorAll('.game-card').forEach(c => c.classList.remove('selected'));
      if(cardEl) cardEl.classList.add('selected');
      
      clearInterval(currentGameLoop);
      currentGame = gameName;
      document.getElementById('snakeControls').style.display = (gameName === 'snake') ? 'grid' : 'none';

      if (gameName === 'snake') initSnake();
      else if (gameName === 'pong') initPong();
      else if (gameName === 'breakout') initBreakout();
    }

    // 1. Snake Game
    let snake, dir, food;
    function initSnake() {
      snake = [{x: 10, y: 10}];
      dir = 'RIGHT';
      food = {x: 5, y: 5};
      currentGameLoop = setInterval(updateSnake, 100);
    }

    function changeDir(newDir) {
      if (newDir === 'LEFT' && dir !== 'RIGHT') dir = 'LEFT';
      if (newDir === 'UP' && dir !== 'DOWN') dir = 'UP';
      if (newDir === 'RIGHT' && dir !== 'LEFT') dir = 'RIGHT';
      if (newDir === 'DOWN' && dir !== 'UP') dir = 'DOWN';
    }

    function updateSnake() {
      let head = {...snake[0]};
      if (dir === 'LEFT') head.x--;
      if (dir === 'UP') head.y--;
      if (dir === 'RIGHT') head.x++;
      if (dir === 'DOWN') head.y++;

      if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20 || snake.some(s => s.x === head.x && s.y === head.y)) {
        return initSnake();
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        food = {x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 20)};
      } else {
        snake.pop();
      }

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, 400, 400);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(food.x * 20, food.y * 20, 18, 18);
      ctx.fillStyle = '#38bdf8';
      snake.forEach(s => ctx.fillRect(s.x * 20, s.y * 20, 18, 18));
    }

    // Touch controls for Pong/Breakout paddles
    canvas.addEventListener('touchmove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const touchX = e.touches[0].clientX - rect.left;
      if (window.paddle) window.paddle.x = touchX - window.paddle.w / 2;
    });

    // 2. Pong (Player vs AI)
    function initPong() {
      let ball = {x: 200, y: 200, dx: 4, dy: 4};
      let p1 = {x: 160, w: 80, y: 380};
      let ai = {x: 160, w: 80, y: 10};
      window.paddle = p1;

      currentGameLoop = setInterval(() => {
        ball.x += ball.dx; ball.y += ball.dy;
        if (ball.x <= 0 || ball.x >= 390) ball.dx *= -1;

        // AI movement
        ai.x += (ball.x - (ai.x + ai.w / 2)) * 0.1;

        // Bounce paddles
        if (ball.y >= p1.y - 10 && ball.x >= p1.x && ball.x <= p1.x + p1.w) ball.dy = -4;
        if (ball.y <= ai.y + 10 && ball.x >= ai.x && ball.x <= ai.x + ai.w) ball.dy = 4;

        if (ball.y < 0 || ball.y > 400) { ball.x = 200; ball.y = 200; }

        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 400, 400);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(p1.x, p1.y, p1.w, 10);
        ctx.fillRect(ai.x, ai.y, ai.w, 10);
        ctx.fillRect(ball.x, ball.y, 10, 10);
      }, 1000/60);
    }

    // 3. Breakout
    function initBreakout() {
      let ball = {x: 200, y: 300, dx: 3, dy: -3};
      let p = {x: 160, w: 80};
      window.paddle = p;
      let bricks = [];
      for(let r=0; r<4; r++) {
        for(let c=0; c<5; c++) bricks.push({x: c*75 + 15, y: r*25 + 30, active: true});
      }

      currentGameLoop = setInterval(() => {
        ball.x += ball.dx; ball.y += ball.dy;
        if (ball.x <= 0 || ball.x >= 390) ball.dx *= -1;
        if (ball.y <= 0) ball.dy *= -1;

        if (ball.y >= 370 && ball.x >= p.x && ball.x <= p.x + p.w) ball.dy = -3;
        if (ball.y > 400) { ball.x = 200; ball.y = 300; ball.dy = -3; }

        bricks.forEach(b => {
          if (b.active && ball.x >= b.x && ball.x <= b.x + 70 && ball.y >= b.y && ball.y <= b.y + 20) {
            b.active = false; ball.dy *= -1;
          }
        });

        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 400, 400);
        ctx.fillStyle = '#38bdf8'; ctx.fillRect(p.x, 380, p.w, 10);
        ctx.fillRect(ball.x, ball.y, 8, 8);
        ctx.fillStyle = '#ef4444';
        bricks.forEach(b => { if(b.active) ctx.fillRect(b.x, b.y, 70, 20); });
      }, 1000/60);
    }

    // Keybindings for Desktop
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') changeDir('LEFT');
      if (e.key === 'ArrowUp') changeDir('UP');
      if (e.key === 'ArrowRight') changeDir('RIGHT');
      if (e.key === 'ArrowDown') changeDir('DOWN');
    });

    /* --- Developer Mode Trigger --- */
    const DEV_CONFIG = { enabled: true, shortcutKey: 'D' };
    function activateDeveloperMode() {
      document.getElementById('coverScreen').style.display = 'none';
      document.getElementById('blockedScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'flex';
      switchTab('view-games', 'nav-games');
      initSnake(); // Start default game
      showToast('Developer Mode: Games Active');
    }

    document.getElementById('devTouchZone').addEventListener('touchstart', (e) => { e.preventDefault(); activateDeveloperMode(); });
    document.getElementById('devTouchZone').addEventListener('click', (e) => { e.preventDefault(); activateDeveloperMode(); });
    window.addEventListener('keydown', (e) => {
      if (e.shiftKey && e.key.toUpperCase() === DEV_CONFIG.shortcutKey) activateDeveloperMode();
    });
  </script>
</body>
</html>
