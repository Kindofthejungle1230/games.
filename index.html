<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Home - Classroom</title>
  <!-- Pixel Font Import -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d0714;
      --card-bg: #180d28;
      --neon-pink: #ff2a85;
      --neon-pink-glow: rgba(255, 42, 133, 0.4);
      --neon-purple: #9d4edd;
      --text-main: #ffffff;
      --text-muted: #ff85a1;
      --border-color: #ff2a85;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      font-family: 'VT323', monospace;
      touch-action: manipulation;
    }

    /* Floating Particle Background Canvas */
    #particleCanvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* --- Overlays & Masking Screens --- */
    .overlay-screen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #ffffff; color: #3c4043; text-align: center; font-family: sans-serif;
    }
    .blocked-screen { background: #1a1a1a; color: #ef4444; display: none; }

    /* Invisible Mobile Developer Mode Corner Touch Target */
    .dev-touch-zone {
      position: absolute; top: 0; right: 0; width: 48px; height: 48px; z-index: 10000;
      background: transparent; -webkit-tap-highlight-color: transparent;
    }

    /* --- Core Dashboard Architecture --- */
    .app-container {
      display: none;
      height: 100vh;
      width: 100vw;
      position: relative;
      z-index: 2;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 1rem 1rem 1rem;
    }

    /* --- Pixel Header & Date Banner --- */
    .header-section {
      text-align: center;
      margin-top: 0.5rem;
    }

    .pixel-day {
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(2.2rem, 6vw, 4rem);
      color: var(--neon-pink);
      text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink-glow), 3px 3px 0px #000;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .pixel-date {
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(0.9rem, 2.5vw, 1.5rem);
      color: #ffffff;
      margin-top: 0.5rem;
      letter-spacing: 3px;
      text-shadow: 2px 2px 0px #000;
    }

    /* --- Neon Search Box --- */
    .search-container {
      width: 100%;
      max-width: 720px;
      position: relative;
      margin: 1.25rem 0;
    }

    .search-input {
      width: 100%;
      background: rgba(24, 13, 40, 0.85);
      border: 3px solid var(--neon-pink);
      border-radius: 8px;
      padding: 0.75rem 3rem 0.75rem 1.25rem;
      font-family: 'VT323', monospace;
      font-size: 1.6rem;
      color: var(--neon-pink);
      outline: none;
      box-shadow: 0 0 15px var(--neon-pink-glow), inset 0 0 10px rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
    }

    .search-input::placeholder { color: rgba(255, 42, 133, 0.6); }

    .search-icon {
      position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
      color: var(--neon-pink); font-size: 1.4rem; pointer-events: none;
    }

    /* --- Game Cards Layout --- */
    .main-content {
      width: 100%;
      max-width: 860px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      width: 100%;
      margin-bottom: 1rem;
    }

    .game-card {
      background: var(--card-bg);
      border: 3px solid var(--neon-pink);
      border-radius: 12px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 10px var(--neon-pink-glow);
    }

    .game-card:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 0 25px var(--neon-pink);
    }

    .game-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .game-title-overlay {
      position: absolute;
      bottom: 0; inset-x: 0;
      background: rgba(13, 7, 20, 0.9);
      color: #fff;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.65rem;
      padding: 0.4rem;
      text-align: center;
      border-top: 2px solid var(--neon-pink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer-quote {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      text-align: center;
      letter-spacing: 1px;
    }

    /* --- Retro Bottom Navigation Dock --- */
    .dock-nav {
      width: 100%;
      max-width: 860px;
      background: rgba(24, 13, 40, 0.9);
      border: 3px solid var(--neon-pink);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0.4rem 0.75rem;
      box-shadow: 0 0 15px var(--neon-pink-glow);
      backdrop-filter: blur(8px);
    }

    .dock-btn {
      background: transparent;
      border: 2px solid transparent;
      color: var(--text-main);
      font-family: 'VT323', monospace;
      font-size: 1.5rem;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .dock-btn:hover {
      border-color: var(--neon-pink);
      color: var(--neon-pink);
      box-shadow: 0 0 8px var(--neon-pink-glow);
    }

    .dock-btn.active {
      background: var(--neon-pink);
      color: #0d0714;
      font-weight: bold;
      box-shadow: 0 0 12px var(--neon-pink);
    }

    /* Responsive Mobile Adjustments */
    @media (max-width: 768px) {
      .games-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
      .pixel-day { font-size: 2rem; }
      .pixel-date { font-size: 0.9rem; }
      .search-input { font-size: 1.2rem; padding: 0.5rem 1rem; }
      .dock-nav { overflow-x: auto; justify-content: flex-start; gap: 0.5rem; }
      .dock-btn { font-size: 1.2rem; padding: 0.3rem 0.6rem; }
    }

    /* Viewer Overlay for Embedded GitHub Games */
    .game-viewer {
      position: fixed; inset: 0; z-index: 500;
      background: #0d0714; display: none; flex-direction: column;
    }
    .game-viewer-bar {
      height: 44px; background: #180d28; border-bottom: 2px solid var(--neon-pink);
      display: flex; align-items: center; justify-content: space-between; padding: 0 1rem;
    }
    .game-viewer-bar button {
      background: var(--neon-pink); color: #0d0714; border: none; padding: 0.3rem 0.8rem;
      font-family: 'Press Start 2P', cursive; font-size: 0.65rem; border-radius: 4px; cursor: pointer;
    }
    .game-viewer iframe { flex: 1; border: none; width: 100%; height: 100%; }

    /* Toast Container */
    #toast-container { position: fixed; bottom: 5rem; right: 1.5rem; z-index: 10000; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { background: var(--card-bg); border: 2px solid var(--neon-pink); color: #fff; padding: 0.6rem 1rem; border-radius: 6px; font-family: 'VT323', monospace; font-size: 1.2rem; }
  </style>
</head>
<body>

  <!-- Background Animated Particle Canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Cover Mask Overlay -->
  <div id="coverScreen" class="overlay-screen">
    <div id="devTouchZone" class="dev-touch-zone" aria-hidden="true"></div>
    <h2 style="font-size: 2rem; color: #3c4043;">Google Classroom</h2>
    <p style="margin-top: 8px; color: #70757a;">Loading classes...</p>
  </div>

  <!-- Blocked Overlay -->
  <div id="blockedScreen" class="overlay-screen blocked-screen">
    <h1 style="font-size: 2.5rem;">403 Restricted</h1>
    <p style="margin-top: 0.5rem;">Access denied by network administrator.</p>
  </div>

  <!-- Main Cassian Synthwave Dashboard -->
  <div id="mainApp" class="app-container">
    
    <!-- Header Displaying Dynamic Day & Date -->
    <header class="header-section">
      <h1 id="dayDisplay" class="pixel-day">SATURDAY</h1>
      <div id="dateDisplay" class="pixel-date">AUGUST 29, 2026</div>
    </header>

    <main class="main-content">
      <!-- Search Bar -->
      <div class="search-container">
        <input type="text" id="gameSearch" class="search-input" placeholder="Search for G4mes! - v4.01" onkeyup="filterGames()">
        <span class="search-icon">🔍</span>
      </div>

      <!-- Retro Arcade Game Cards Grid -->
      <div class="games-grid" id="gamesGrid">
        <div class="game-card" data-name="fnf" onclick="launchGame('https://play2048.co/')">
          <img src="https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/javascript/javascript.png" alt="FNF" id="img-fnf">
          <div class="game-title-overlay">FNF</div>
        </div>
        <div class="game-card" data-name="1v1lol" onclick="launchGame('https://hextris.io/')">
          <img src="https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/html/html.png" alt="1v1.LOL" id="img-1v1">
          <div class="game-title-overlay">1v1.LOL</div>
        </div>
        <div class="game-card" data-name="retrobowl" onclick="launchGame('https://pacman.cc/')">
          <img src="https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/css/css.png" alt="Retro Bowl" id="img-retro">
          <div class="game-title-overlay">Retro Bowl</div>
        </div>
        <div class="game-card" data-name="geometrydash" onclick="launchGame('https://paper-io.com/')">
          <img src="https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/canvas/canvas.png" alt="Geometry Dash" id="img-gd">
          <div class="game-title-overlay">Geo Dash</div>
        </div>
      </div>

      <div class="footer-quote">rub your Chromebook for good luck -</div>
    </main>

    <!-- Retro Navigation Bar Dock -->
    <nav class="dock-nav">
      <button class="dock-btn active">🏠 Home</button>
      <button class="dock-btn" onclick="showToast('Games active')">🎮 Games</button>
      <button class="dock-btn" onclick="showToast('Tools section')">🛠️ Tools</button>
      <button class="dock-btn" onclick="showToast('Apps section')">💬 Apps</button>
      <button class="dock-btn" onclick="showToast('Settings')">⚙️ Settings</button>
    </nav>
  </div>

  <!-- Game Embed Viewer Overlay -->
  <div id="gameViewer" class="game-viewer">
    <div class="game-viewer-bar">
      <span style="color: var(--neon-pink); font-family: 'Press Start 2P', cursive; font-size: 0.7rem;">CASSIAN RUNTIME</span>
      <button onclick="closeGame()">CLOSE [X]</button>
    </div>
    <iframe id="gameViewerFrame" src="about:blank"></iframe>
  </div>

  <div id="toast-container"></div>

  <script>
    /* ==========================================================================
       1. DYNAMIC DATE & BACKGROUND PARTICLES
       ========================================================================== */
    function updateDateDisplay() {
      const now = new Date();
      const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
      const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
      
      document.getElementById('dayDisplay').textContent = days[now.getDay()];
      document.getElementById('dateDisplay').textContent = `${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
    }
    updateDateDisplay();

    // Floating Dust Particle Simulation Canvas
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for(let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 1,
        alpha: Math.random() * 0.6 + 0.2,
        speedY: -Math.random() * 0.4 - 0.1
      });
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff2a85';
      
      particles.forEach(p => {
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        p.y += p.speedY;
        if(p.y < 0) p.y = canvas.height;
      });
      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    /* ==========================================================================
       2. UI SEARCH & GAME LAUNCHER
       ========================================================================== */
    function filterGames() {
      const query = document.getElementById('gameSearch').value.toLowerCase();
      document.querySelectorAll('.game-card').forEach(card => {
        const text = card.getAttribute('data-name') + card.textContent;
        card.style.display = text.toLowerCase().includes(query) ? 'block' : 'none';
      });
    }

    function launchGame(url) {
      document.getElementById('gameViewerFrame').src = url;
      document.getElementById('gameViewer').style.display = 'flex';
    }

    function closeGame() {
      document.getElementById('gameViewerFrame').src = 'about:blank';
      document.getElementById('gameViewer').style.display = 'none';
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    /* ==========================================================================
       3. DEVELOPER MODE SHORTCUT (MOBILE & DESKTOP)
       ========================================================================== */
    const DEV_CONFIG = { enabled: true, shortcutKey: 'D' };

    function activateDeveloperMode() {
      if (!DEV_CONFIG.enabled) return;
      document.getElementById('coverScreen').style.display = 'none';
      document.getElementById('blockedScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'flex';
      showToast('Developer Mode Active');
    }

    // Stealth Touch Target on Top-Right Corner for Mobile
    const devTouchZone = document.getElementById('devTouchZone');
    if (devTouchZone) {
      devTouchZone.addEventListener('touchstart', (e) => { e.preventDefault(); activateDeveloperMode(); });
      devTouchZone.addEventListener('click', (e) => { e.preventDefault(); activateDeveloperMode(); });
    }

    // Desktop Key Binding (Shift + D) & Standard Escape Sequence (5x)
    let escCount = 0;
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        escCount++;
        if (escCount >= 5) activateDeveloperMode();
      }
      if (DEV_CONFIG.enabled && e.shiftKey && e.key.toUpperCase() === DEV_CONFIG.shortcutKey) {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        e.preventDefault();
        activateDeveloperMode();
      }
    });
  </script>
</body>
</html>
